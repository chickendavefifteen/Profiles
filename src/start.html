<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Start</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#14101d}
body{font-family:"Adwaita Sans","Noto Sans",system-ui,sans-serif;background:#14101d;color:#ece4f8;
 margin:0;padding:80px 24px 24px;text-align:center}
.wrap{width:92%;max-width:560px;margin:0 auto;text-align:center}
.mark{font-weight:800;font-size:1.6rem;letter-spacing:-.02em;margin-bottom:6px}
.mark i{font-style:normal}
.mark i:nth-child(1){color:#b78ae0}.mark i:nth-child(2){color:#7f6fc4}.mark i:nth-child(3){color:#ece4f8}
.sub{color:#a89cc6;font-size:.9rem;margin:0 0 22px}
form{width:100%;}
input{width:100%;font:inherit;font-size:1.05rem;color:#ece4f8;background:#211a2e;border:1.5px solid #352a4c;
 border-radius:14px;padding:14px 18px;min-height:54px;outline:none}
input:focus{border-color:#b78ae0}
.links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.links a{font-size:.84rem;color:#a89cc6;background:#211a2e;border:1px solid #352a4c;border-radius:99px;
 padding:8px 16px;text-decoration:none}
.links a:hover{color:#ece4f8;border-color:#b78ae0}
</style>
<script>window.__API="__API__";</script>
</head>
<body>
<div class="wrap">
<div class="mark">Start</div>
<p class="sub">A calm corner of Profiles. Search below, or pick somewhere to go.</p>
<form id="f">
  <input id="q" type="text" autocomplete="off" placeholder="Search the web, or type a web address…" aria-label="Search or address">
</form>
<div class="links">
  <a href="https://www.google.com">Google</a>
  <a href="__API__/api/proxy?url=https%3A%2F%2Fwww.bbc.co.uk%2Fnews">BBC News</a>
  <a href="__API__/api/proxy?url=https%3A%2F%2Fen.wikipedia.org">Wikipedia</a>
  <a href="__API__/api/proxy?url=https%3A%2F%2Fwww.bing.com">Bing</a>
</div>
</div>
<script>
document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  var q=document.getElementById('q').value.trim();
  if(!q) return;
  if(/^https?:\/\//i.test(q)||/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(q)){
    var url=/^https?:\/\//i.test(q)?q:'https://'+q;
    location.href=window.__API+'/api/proxy?url='+encodeURIComponent(url);
  } else {
    /* Headed user search: engine pref, Google default. Server /api/search
       stays Bing-backed for headless safety — never route it here. */
    var eng="google";
    try{ eng=String(localStorage.getItem("profiles.searchEngine")||"google").toLowerCase(); }catch(x){}
    var u=encodeURIComponent(q);
    location.href=eng==="bing"?"https://www.bing.com/search?q="+u:eng==="duckduckgo"?"https://html.duckduckgo.com/html/?q="+u:"https://www.google.com/search?q="+u;
  }
});
window.addEventListener('wheel', function(e){
  if(e.ctrlKey || e.metaKey){
    e.preventDefault(); e.stopPropagation();
    var d = e.deltaY < 0 ? 0.1 : (e.deltaY > 0 ? -0.1 : 0);
    window.parent.postMessage({ type: 'browser_zoom_step', step: d }, '*');
  }
}, { passive: false, capture: true });
window.addEventListener('keydown', function(e){
  if(e.ctrlKey || e.metaKey){
    if(e.key === '=' || e.key === '+' || e.key === '-' || e.key === '_' || e.key === '0'){
      e.preventDefault();
      var step = (e.key === '-' || e.key === '_') ? -0.1 : (e.key === '0' ? 0 : 0.1);
      window.parent.postMessage({ type: 'browser_zoom_key', step: step }, '*');
    }
  }
}, true);
</script>
</body>
</html>
